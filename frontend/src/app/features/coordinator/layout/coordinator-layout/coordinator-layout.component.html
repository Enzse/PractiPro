<app-shell [navGroups]="nav()" roleLabel="Coordinator">
  <div shellSidebarHeader>
    <button type="button" [matMenuTriggerFor]="classMenu"
      class="flex w-full items-center gap-3 rounded-xl bg-slate-50 px-3 py-2.5 text-left ring-1 ring-slate-900/5 transition hover:bg-slate-100">
      <span class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-white text-brand-700 shadow-card ring-1 ring-slate-900/5">
        <app-icon name="users-three" [size]="16" />
      </span>
      <span class="min-w-0 flex-1">
        <span class="block text-[11px] text-slate-500">Class</span>
        <span class="block truncate text-sm font-semibold text-slate-900">{{ block() ?? 'Choose a class' }}</span>
      </span>
      <app-icon name="caret-up-down" [size]="16" class="text-slate-400" />
    </button>
    <mat-menu #classMenu="matMenu">
      @for (item of classes.classes() ?? []; track item.block_name) {
        <button mat-menu-item type="button" (click)="switchTo(item.block_name)">
          <span class="flex items-center justify-between gap-6">
            <span class="font-medium">{{ item.block_name }}</span>
            @if (item.block_name === block()) {
              <app-icon name="check" [size]="16" class="text-brand-700" />
            } @else {
              <span class="text-xs text-slate-400">{{ item.students_handled }} {{ item.students_handled === 1 ? 'student' : 'students' }}</span>
            }
          </span>
        </button>
      } @empty {
        <p class="px-4 py-2 text-sm text-slate-500">No classes yet</p>
      }
      <div class="my-1 h-px bg-slate-100"></div>
      <a mat-menu-item routerLink="/coordinator/classes">
        <span class="flex items-center gap-2 text-slate-600"><app-icon name="squares-four" [size]="16" /> All classes</span>
      </a>
    </mat-menu>
  </div>

  <router-outlet />
</app-shell>
