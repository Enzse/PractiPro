<form [formGroup]="form" (ngSubmit)="save()" novalidate>
  <app-dialog-shell title="Edit profile" description="Keep these up to date; your coordinator and supervisor rely on them." icon="user-circle">
    <div class="space-y-6">
      <fieldset>
        <legend class="eyebrow mb-3">Name</legend>
        <div class="grid gap-4 sm:grid-cols-2">
          <div>
            <label class="label" for="first-name">First name</label>
            <input id="first-name" type="text" class="input" autocomplete="given-name" formControlName="firstName" />
            @if (invalid('firstName')) {
              <p class="field-error">Enter your first name.</p>
            }
          </div>
          <div>
            <label class="label" for="last-name">Last name</label>
            <input id="last-name" type="text" class="input" autocomplete="family-name" formControlName="lastName" />
            @if (invalid('lastName')) {
              <p class="field-error">Enter your last name.</p>
            }
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend class="eyebrow mb-3">School</legend>
        <div class="grid gap-4 sm:grid-cols-3">
          <div>
            <label class="label" for="student-id">Student ID</label>
            <input id="student-id" type="text" inputmode="numeric" class="input" placeholder="202211557" formControlName="studentId" />
            @if (invalid('studentId')) {
              <p class="field-error">Use your 9-digit student ID.</p>
            }
          </div>
          <div>
            <label class="label" for="program">Program</label>
            <select id="program" class="input" formControlName="program">
              <option value="" disabled>Choose</option>
              @for (program of programs; track program) {
                <option [value]="program">{{ program }}</option>
              }
            </select>
          </div>
          <div>
            <label class="label" for="year">Year level</label>
            <select id="year" class="input" formControlName="year">
              <option value="" disabled>Choose</option>
              @for (year of years; track year) {
                <option [value]="'' + year">Year {{ year }}</option>
              }
            </select>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend class="eyebrow mb-3">Personal</legend>
        <div class="grid gap-4 sm:grid-cols-2">
          <div>
            <label class="label" for="phone">Phone number</label>
            <input id="phone" type="tel" inputmode="numeric" class="input" placeholder="09171234567" autocomplete="tel" formControlName="phoneNumber" />
            @if (invalid('phoneNumber')) {
              <p class="field-error">Use an 11-digit number, like 09171234567.</p>
            }
          </div>
          <div>
            <label class="label" for="dob">Date of birth</label>
            <input id="dob" type="date" class="input" autocomplete="bday" formControlName="dateOfBirth" />
          </div>
          <div class="sm:col-span-2">
            <label class="label" for="address">Address</label>
            <input id="address" type="text" class="input" autocomplete="street-address" formControlName="address" />
          </div>
        </div>
      </fieldset>
    </div>

    <footer dialogFooter class="dialog-footer">
      <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
      <button type="submit" class="btn btn-primary" [disabled]="saving()">
        @if (saving()) {
          <app-icon name="circle-notch" [size]="16" class="animate-spin" />
        }
        Save changes
      </button>
    </footer>
  </app-dialog-shell>
</form>
