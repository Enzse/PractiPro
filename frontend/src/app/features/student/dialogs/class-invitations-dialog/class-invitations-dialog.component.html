<app-dialog-shell title="Class invitation" icon="users-three">
  @if (loading()) {
    <div class="skeleton h-40 rounded-xl"></div>
  } @else if (invitation(); as invitation) {
    <div class="rounded-2xl bg-slate-50 p-6 text-center ring-1 ring-inset ring-slate-900/5">
      <p class="text-sm text-slate-500">{{ invitation.advisorFirstName }} {{ invitation.advisorLastName }} invited you to join</p>
      <p class="mt-2 font-display text-3xl font-semibold tracking-[-0.02em] text-brand-900">{{ invitation.class }}</p>
    </div>
    <p class="mt-4 text-center text-[13px] text-slate-500">
      Not expecting this?
      <button type="button" class="font-medium text-red-600 hover:underline" [disabled]="busy()" (click)="decline(invitation)">Decline it</button>
    </p>
  } @else {
    <app-empty-state icon="users-three:duotone" title="No invitations right now"
      description="When a coordinator invites you to their class, it shows up here." [compact]="true" />
  }

  @if (invitation(); as invitation) {
    <footer dialogFooter class="dialog-footer">
      <button type="button" class="btn btn-secondary" (click)="dialogRef.close()">Not now</button>
      <button type="button" class="btn btn-primary" [disabled]="busy()" (click)="join(invitation)">
        @if (busy()) {
          <app-icon name="circle-notch" [size]="16" class="animate-spin" />
        }
        Join {{ invitation.class }}
      </button>
    </footer>
  }
</app-dialog-shell>
