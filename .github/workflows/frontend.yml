name: Frontend

on:
  push:
    paths: ['PractiProAngular/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['PractiProAngular/**', '.github/workflows/frontend.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PractiProAngular

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: PractiProAngular/package-lock.json

      - run: npm ci

      - name: Tests
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build --configuration development
